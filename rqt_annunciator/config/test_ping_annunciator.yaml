# Annunciator config for cross-repo testing with network_tools ping monitor.
# No build dependency — just matches diagnostic names from ping_monitor_node
# when launched with network_tools/config/test_ping_targets.yaml.
#
# Terminal 1: ros2 launch network_tools ping_monitor.launch.py \
#               config_file:=$(ros2 pkg prefix network_tools)/share/network_tools/config/test_ping_targets.yaml
# Terminal 2: rqt --standalone rqt_annunciator
#   then load this config via File dialog.
diagnostics_topic: /diagnostics
indicators:
  - name: Localhost
    source: diagnostics
    diagnostic_name: "ping.test: localhost"
    stale_timeout: 15.0

  - name: Google DNS
    source: diagnostics
    diagnostic_name: "ping.test: google_dns"
    stale_timeout: 15.0

  - name: Cloudflare DNS
    source: diagnostics
    diagnostic_name: "ping.test: cloudflare_dns"
    stale_timeout: 15.0

  - name: Unreachable
    source: diagnostics
    diagnostic_name: "ping.test: unreachable"
    stale_timeout: 15.0
